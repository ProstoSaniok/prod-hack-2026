[project]
name = "template_project"
requires-python = ">=3.12"
description = "Reusable FastAPI backend template"
version = "1.0.0"
dependencies = [
    "fastapi==0.119.0",
    "uvicorn==0.37.0",
    "dishka==1.7.2",
    "httpx==0.28.1",
    "pydantic[email]>=2.12.4",
    "argon2-cffi==23.1.0",
    "cryptography==46.0.3",
    "adaptix==3.0.0b11",
    "sqlalchemy[asyncio]==2.0.44",
    "psycopg[binary]>=3.2.12",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-sdk==1.38.0",
    "opentelemetry-exporter-otlp-proto-http==1.38.0",
    "opentelemetry-instrumentation-fastapi==0.59b0",
]

[dependency-groups]
migrations = [
    "alembic==1.17.0",
]
linters = [
    "mypy==1.18.1",
    "ruff==0.12.11",
    "codespell==2.4.1",
    "bandit==1.8.6",
]
tests = [
    "pytest==8.4.0",
    "coverage==7.11.0",
    "pytest_asyncio==1.2.0",
]
dev = [
    { include-group = "tests" },
    { include-group = "linters" },
    { include-group = "migrations" },
]

[project.scripts]
web_api_cli = "src.web_api.entry_point:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
strict_bytes = true
local_partial_types = true
warn_unreachable = true
files = ["src", "tests"]
exclude = [
    "src/migrations",
]
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "redundant-expr",
    "unused-awaitable",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-self",
    "explicit-override",
    "mutable-override",
    "unimported-reveal",
    "deprecated",
]

[tool.ruff]
preview = true
target-version = "py312"
line-length = 120
indent-width = 4
exclude = [
    "src/migrations/**.py",
]

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "C90", # maccabe
    "COM", # flake8-commas
    "D", # pydocstyle
    "DTZ", # flake8-datetimez
    "E", # pycodestyle
    "ERA", # flake8-eradicate
    "EXE", # flake8-executable
    "F", # pyflakes
    "FA", # flake8-future-annotations
    "FBT", # flake8-boolean-trap
    "FLY", # pyflint
    "FURB", # refurb
    "G", # flake8-logging-format
    "I", # isort
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    "LOG", # flake8-logging
    "N", # pep8-naming
    "PERF", # perflint
    "PIE", # flake8-pie
    "PL", # pylint
    "PT", # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "Q", # flake8-quotes
    "RET", # flake8-return
    "RSE", # flake8-raise
    "RUF", # ruff
    "S", # flake8-bandit
    "SIM", # flake8-simpify
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "T100", # flake8-debugger
    "TRY", # tryceratops
    "UP", # pyupgrade
    "W", # pycodestyle
    "YTT", # flake8-2020
]
ignore = [
    "PLR1702",
    "A005", # allow to shadow stdlib and builtin module names
    "COM812", # trailing comma, conflicts with `ruff format`
    # Different doc rules that we don't really care about:
    "D",
    "ISC001", # implicit string concat conflicts with `ruff format`
    "ISC003", # prefer explicit string concat over implicit concat
    "PLR09", # we have our own complexity rules
    "PLR2004", # do not report magic numbers
    "PLR6301", # do not require classmethod / staticmethod when self not used
    "TRY003", # long exception messages from `tryceratops`
    "N813",
    "S106",
    "ERA",
    "PT022",
    "RUF"
]
external = ["WPS"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "S101", # asserts
]

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# This is only required because we have invalid on-purpose code in docstrings:
docstring-code-format = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]


[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if __name__ == .__main__.:",
    "self.logger",
    "def __repr__",
    "lambda: None",
    "from .*",
    "import .*",
    '@(abc\.)?abstractmethod',
    "raise NotImplementedError",
    'raise AssertionError',
    'logger\..*',
    "pass",
    '\.\.\.',
]
omit = [
    '*/__about__.py',
    '*/__main__.py',
    '*/__init__.py',
]
