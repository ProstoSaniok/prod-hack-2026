extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        # Federation forwards current samples, not a historical backfill. Keep
        # original target identity and timestamps, and stop forwarding stale data.
        - job_name: victoriametrics-federation
          scrape_interval: 30s
          scrape_timeout: 10s
          metrics_path: /federate
          honor_labels: true
          honor_timestamps: true
          params:
            match[]: ['{job!=""}']
            max_lookback: [1m]
          static_configs:
            - targets: [victoriametrics:8428]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 1000
    send_batch_max_size: 1000

exporters:
  prometheus_remote_write/sage:
    http:
      endpoint: ${env:SAGE_REMOTE_WRITE_ENDPOINT}
      headers:
        Authorization: ${env:SAGE_REMOTE_WRITE_AUTHORIZATION}
      timeout: 10s
    external_labels:
      group: ${env:SAGE_GROUP}
      system: ${env:SAGE_SYSTEM}
      env: ${env:SAGE_ENV}
      dc: ${env:SAGE_DC}
    # Federation has no metric type metadata; retain the original series names.
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    target_info:
      enabled: false
    max_batch_size_bytes: 1000000
    max_batch_request_parallelism: 1
    remote_write_queue:
      queue_size: 10000
      num_consumers: 1
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
  otlp_http/sage_agent:
    endpoint: ${env:SAGE_AGENT_OTLP_ENDPOINT}
    compression: gzip
    timeout: 5s
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus_remote_write/sage]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/sage_agent]
  # Logs remain on stdout for the host Sage Agent; its OTLP endpoint is trace-only.
