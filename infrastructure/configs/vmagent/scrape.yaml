global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: postgresql
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: valkey
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: backend
    static_configs:
      - targets: [backend:8080]
  - job_name: vmagent
    static_configs:
      - targets: [vmagent:8429]
  - job_name: victoriametrics
    static_configs:
      - targets: [victoriametrics:8428]
